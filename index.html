<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Поверхности второго порядка — 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:#f8faff;color:#1e293b;display:flex;flex-direction:column;height:100dvh;}

header{
  height:50px;background:#fff;border-bottom:1px solid #e2e8f0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.logo{font-size:.95rem;font-weight:600;color:#1e293b;}
.logo span{color:#94a3b8;font-weight:400;}
.author-badge{font-size:.72rem;color:#64748b;background:#f1f5f9;border:1px solid #e2e8f0;padding:5px 13px;border-radius:20px;white-space:nowrap;}
.author-badge strong{color:#3b82f6;font-weight:600;}
.mob-btn{display:none;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:7px 12px;font-size:.78rem;color:#374151;cursor:pointer;}
@media(max-width:700px){.mob-btn{display:block;}.author-badge{font-size:.62rem;padding:4px 8px;}}

.app{flex:1;display:flex;overflow:hidden;position:relative;}
.canvas-wrap{flex:1;position:relative;background:#fff;}
#c3d{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
#c3d:active{cursor:grabbing;}

.panel{
  width:320px;min-width:300px;background:#fff;border-right:1px solid #e2e8f0;
  display:flex;flex-direction:column;overflow-y:auto;order:-1;
}
@media(max-width:700px){
  .panel{position:absolute;bottom:0;left:0;right:0;width:100%;min-width:0;
    border-right:none;border-top:1px solid #e2e8f0;border-radius:18px 18px 0 0;
    height:76vh;transform:translateY(100%);transition:transform .3s ease;z-index:15;}
  .panel.open{transform:translateY(0);}
  .fab{display:flex!important;}
}
.drag-bar{width:36px;height:4px;background:#cbd5e1;border-radius:2px;margin:10px auto 4px;cursor:pointer;flex-shrink:0;}

/* SURF TABS */
.surf-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #e2e8f0;background:#f8faff;}
.surf-tab{
  flex:1;min-width:0;padding:9px 2px;font-size:.62rem;font-weight:500;color:#94a3b8;
  background:transparent;border:none;cursor:pointer;transition:all .15s;
  border-bottom:2px solid transparent;font-family:'Inter',sans-serif;text-align:center;line-height:1.5;
}
.surf-tab:hover{color:#475569;background:#f1f5f9;}
.surf-tab.active{color:#3b82f6;border-bottom-color:#3b82f6;font-weight:600;background:#fff;}

/* EQ */
.eq-section{padding:12px 16px;border-bottom:1px solid #e2e8f0;background:#f8faff;}
.eq-box{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 13px;}
.eq-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.eq-formula{font-size:.88rem;color:#1e293b;font-weight:500;}

/* SLIDERS */
.sliders{padding:4px 0;}
.sl-row{padding:11px 16px;border-bottom:1px solid #f1f5f9;}
.sl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sl-name{font-size:.82rem;color:#374151;font-weight:600;}
.sl-val{
  font-size:.82rem;color:#3b82f6;font-weight:700;
  background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:7px;
  padding:3px 10px;min-width:52px;text-align:center;
  outline:none;font-family:'Inter',sans-serif;cursor:text;
}
.sl-val:focus{border-color:#3b82f6;background:#fff;}
.sl-track{display:flex;align-items:center;gap:8px;}
.sl-edge{font-size:.65rem;color:#94a3b8;width:14px;text-align:center;}
input[type=range]{
  flex:1;height:5px;-webkit-appearance:none;
  background:linear-gradient(to right,#3b82f6 var(--pct,50%),#e2e8f0 var(--pct,50%));
  border-radius:3px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#3b82f6;cursor:pointer;box-shadow:0 1px 6px rgba(59,130,246,.4);
  border:2px solid #fff;transition:transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}

.build-btn{
  margin:12px 16px;padding:12px;background:#3b82f6;color:#fff;border:none;
  border-radius:10px;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:600;
  cursor:pointer;transition:all .15s;box-shadow:0 3px 10px rgba(59,130,246,.25);
  display:block;width:calc(100% - 32px);
}
.build-btn:hover{background:#2563eb;transform:translateY(-1px);}
.build-btn:active{transform:none;}

/* INFO */
.info-sec{padding:12px 16px 16px;}
.info-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1.5px;color:#94a3b8;font-weight:600;margin-bottom:8px;}
.info-chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.chip{background:#f8faff;border:1px solid #e2e8f0;border-radius:9px;padding:8px 10px;}
.chip-k{font-size:.6rem;color:#94a3b8;font-weight:500;margin-bottom:2px;}
.chip-v{font-size:.78rem;color:#1e293b;font-weight:700;}

/* OVERLAYS */
.badge3d{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.96);border:1px solid #e2e8f0;border-radius:10px;padding:8px 13px;pointer-events:none;display:none;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.b3-name{font-size:.75rem;color:#1e293b;font-weight:700;display:block;margin-bottom:1px;}
.b3-eq{font-size:.65rem;color:#64748b;}
.hint3d{position:absolute;bottom:12px;right:12px;background:rgba(255,255,255,.92);border:1px solid #e2e8f0;border-radius:9px;padding:7px 12px;font-size:.6rem;color:#94a3b8;pointer-events:none;line-height:2;box-shadow:0 1px 4px rgba(0,0,0,.05);}
@media(max-width:700px){.hint3d{display:none;}}
.errmsg{position:absolute;bottom:12px;left:12px;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:9px;padding:7px 13px;font-size:.7rem;color:#dc2626;pointer-events:none;display:none;font-weight:500;}
.fab{display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#3b82f6;border:none;color:#fff;padding:13px 30px;border-radius:30px;font-family:'Inter',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;z-index:4;box-shadow:0 6px 20px rgba(59,130,246,.4);touch-action:manipulation;white-space:nowrap;}
.fab.hidden{display:none!important;}
</style>
</head>
<body>

<header>
  <div class="logo">Поверхности <span>второго порядка — 3D</span></div>
  <div class="author-badge">Сайт <strong>Кенжегулова Нурсултана</strong></div>
  <button class="mob-btn" id="mob-btn">☰ Меню</button>
</header>

<div class="app">
  <div class="canvas-wrap">
    <canvas id="c3d"></canvas>
    <div class="badge3d" id="badge"><span class="b3-name" id="bname"></span><span class="b3-eq" id="beq"></span></div>
    <div class="hint3d">🖱 Перетащи — вращение<br>⚙ Колёсико — масштаб</div>
    <div class="errmsg" id="errmsg"></div>
    <button class="fab" id="fab">📐 Параметры</button>
  </div>

  <div class="panel" id="panel">
    <div class="drag-bar" id="drag-bar"></div>
    <div class="surf-tabs" id="surf-tabs">
      <button class="surf-tab active" data-surf="ellipsoid">🥚<br>Эллипсоид</button>
      <button class="surf-tab" data-surf="sphere">⭕<br>Сфера</button>
      <button class="surf-tab" data-surf="hyp1">〰<br>Гиперб.1</button>
      <button class="surf-tab" data-surf="hyp2">〰〰<br>Гиперб.2</button>
      <button class="surf-tab" data-surf="ellippar">📈<br>Эл.пар.</button>
      <button class="surf-tab" data-surf="hyppar">🏔<br>Гп.пар.</button>
    </div>
    <div class="eq-section">
      <div class="eq-box">
        <div class="eq-dot" id="eq-dot" style="background:#e53935"></div>
        <div class="eq-formula" id="eq-formula">x²/a² + y²/b² + z²/c² = 1</div>
      </div>
    </div>
    <div class="sliders" id="sliders"></div>
    <button class="build-btn" id="bbtn">▶ Построить</button>
    <div class="info-sec">
      <div class="info-label">Характеристики</div>
      <div class="info-chips" id="info-chips"></div>
    </div>
  </div>
</div>

<script>
// ── PANEL ──────────────────────────────────────
const panel=document.getElementById('panel'),fab=document.getElementById('fab');
document.getElementById('drag-bar').onclick=()=>{panel.classList.remove('open');fab.classList.remove('hidden');};
fab.onclick=()=>{panel.classList.add('open');fab.classList.add('hidden');};
document.getElementById('mob-btn').onclick=()=>{panel.classList.contains('open')?(panel.classList.remove('open'),fab.classList.remove('hidden')):(panel.classList.add('open'),fab.classList.add('hidden'));};

// ── THREE.JS ───────────────────────────────────
const cv=document.getElementById('c3d');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false});
ren.setPixelRatio(Math.min(window.devicePixelRatio,2));
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
const sc=new THREE.Scene();
sc.background=new THREE.Color(0xffffff);
const cam=new THREE.PerspectiveCamera(40,1,.1,500);

// ── LIGHTS ─────────────────────────────────────
sc.add(new THREE.AmbientLight(0xffffff,.55));
const dl=new THREE.DirectionalLight(0xffffff,1.0);dl.position.set(8,16,12);dl.castShadow=true;sc.add(dl);
const dl2=new THREE.DirectionalLight(0xdbeafe,.5);dl2.position.set(-10,4,-8);sc.add(dl2);
const dl3=new THREE.DirectionalLight(0xfff3e0,.3);dl3.position.set(4,-8,4);sc.add(dl3);

// ── COORDINATE SYSTEM ──────────────────────────
// Proper XYZ axes with labels and tick marks
function makeCoords(){
  const g=new THREE.Group();
  const LEN=7;

  // Axes
  const colors={x:0xef4444,y:0x22c55e,z:0x3b82f6};
  const dirs={
    x:new THREE.Vector3(LEN,0,0),
    y:new THREE.Vector3(0,LEN,0),
    z:new THREE.Vector3(0,0,LEN)
  };

  Object.entries(dirs).forEach(([name,end])=>{
    const col=colors[name];
    const mat=new THREE.LineBasicMaterial({color:col,linewidth:2});
    // Negative part (dashed look — thin)
    const negEnd=end.clone().negate();
    const matNeg=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.25});
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),negEnd]),matNeg));
    // Positive part
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),end]),mat));
    // Arrow cone
    const cone=new THREE.Mesh(new THREE.ConeGeometry(.12,.4,12),new THREE.MeshBasicMaterial({color:col}));
    cone.position.copy(end);
    if(name==='x')cone.rotation.z=-Math.PI/2;
    else if(name==='z')cone.rotation.x=Math.PI/2;
    g.add(cone);
    // Tick marks every 2 units
    for(let t=2;t<LEN;t+=2){
      const tickSize=.12;
      const pos=end.clone().normalize().multiplyScalar(t);
      const pts=[];
      if(name==='x'){pts.push(new THREE.Vector3(t,-tickSize,0),new THREE.Vector3(t,tickSize,0));}
      else if(name==='y'){pts.push(new THREE.Vector3(-tickSize,t,0),new THREE.Vector3(tickSize,t,0));}
      else{pts.push(new THREE.Vector3(-tickSize,0,t),new THREE.Vector3(tickSize,0,t));}
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.5})));
    }
  });

  // Grid on XZ plane (horizontal ground)
  const gridMat=new THREE.LineBasicMaterial({color:0xdde3f0,transparent:true,opacity:.5});
  for(let i=-6;i<=6;i+=2){
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-6,0,i),new THREE.Vector3(6,0,i)]),gridMat));
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i,0,-6),new THREE.Vector3(i,0,6)]),gridMat));
  }

  // Origin dot
  const orig=new THREE.Mesh(new THREE.SphereGeometry(.1,12,12),new THREE.MeshBasicMaterial({color:0x64748b}));
  g.add(orig);

  return g;
}
sc.add(makeCoords());

// ── SMOOTH ORBIT ───────────────────────────────
let tTh=0.55,tPh=1.05,tR=18,cTh=0.55,cPh=1.05,cR=18;
let isDrag=false,lm={x:0,y:0};
cv.addEventListener('mousedown',e=>{isDrag=true;lm={x:e.clientX,y:e.clientY};e.preventDefault();});
window.addEventListener('mouseup',()=>isDrag=false);
window.addEventListener('mousemove',e=>{if(!isDrag)return;tTh-=(e.clientX-lm.x)*.007;tPh=Math.max(.05,Math.min(Math.PI-.05,tPh+(e.clientY-lm.y)*.007));lm={x:e.clientX,y:e.clientY};});
cv.addEventListener('wheel',e=>{tR=Math.max(4,Math.min(50,tR+e.deltaY*.04));e.preventDefault();},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
let tc={},pd=0;
cv.addEventListener('touchstart',e=>{[...e.touches].forEach(t=>tc[t.identifier]={x:t.clientX,y:t.clientY});if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pd=Math.sqrt(dx*dx+dy*dy);}e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{if(e.touches.length===1){const t=e.touches[0],p=tc[t.identifier]||lm;tTh-=(t.clientX-p.x)*.007;tPh=Math.max(.05,Math.min(Math.PI-.05,tPh+(t.clientY-p.y)*.007));tc[t.identifier]={x:t.clientX,y:t.clientY};}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);tR=Math.max(4,Math.min(50,tR*(pd/d)));pd=d;[...e.touches].forEach(t=>tc[t.identifier]={x:t.clientX,y:t.clientY});}e.preventDefault();},{passive:false});
cv.addEventListener('touchend',e=>{[...e.changedTouches].forEach(t=>delete tc[t.identifier]);},{passive:false});
function resize(){const w=cv.parentElement.clientWidth,h=cv.parentElement.clientHeight;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
const D=.08;
function updCam(){cTh+=(tTh-cTh)*D;cPh+=(tPh-cPh)*D;cR+=(tR-cR)*D;cam.position.set(cR*Math.sin(cPh)*Math.sin(cTh),cR*Math.cos(cPh),cR*Math.sin(cPh)*Math.cos(cTh));cam.lookAt(0,0,0);}

// ── PARAMETRIC SURFACE BUILDERS ────────────────
// Use PARAMETRIC approach for smooth closed surfaces — NO HOLES!
let curMesh=null;
function clearMesh(){if(curMesh){sc.remove(curMesh);curMesh=null;}}

// Build from parametric (u,v) -> (x,y,z), smooth and hole-free
function buildParametric(fn, uSegs, vSegs, color, uMin=0, uMax=Math.PI*2, vMin=0, vMax=Math.PI, closed=false){
  const geo=new THREE.BufferGeometry();
  const pos=[],nrm=[],uv=[],idx=[];
  const U=uSegs,V=vSegs;
  for(let iv=0;iv<=V;iv++){
    for(let iu=0;iu<=U;iu++){
      const u=uMin+(uMax-uMin)*(iu/U);
      const v=vMin+(vMax-vMin)*(iv/V);
      const p=fn(u,v);
      pos.push(p.x,p.y,p.z);
      uv.push(iu/U,iv/V);
      // Normal via finite diff
      const eps=1e-4;
      const pu=fn(u+eps,v),pd=fn(u-eps,v),pv=fn(u,v+eps),pvd=fn(u,v-eps);
      const du=new THREE.Vector3((pu.x-pd.x)/(2*eps),(pu.y-pd.y)/(2*eps),(pu.z-pd.z)/(2*eps));
      const dv=new THREE.Vector3((pv.x-pvd.x)/(2*eps),(pv.y-pvd.y)/(2*eps),(pv.z-pvd.z)/(2*eps));
      const n=du.cross(dv).normalize();
      nrm.push(n.x,n.y,n.z);
    }
  }
  for(let iv=0;iv<V;iv++){
    for(let iu=0;iu<U;iu++){
      const a=iv*(U+1)+iu,b=a+1,c=a+(U+1),d=c+1;
      idx.push(a,b,c,b,d,c);
    }
  }
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const c=new THREE.Color(color);
  const mat=new THREE.MeshPhongMaterial({color:c,emissive:c.clone().multiplyScalar(.06),specular:new THREE.Color(0xffffff),shininess:80,transparent:true,opacity:.92,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.castShadow=true;
  return mesh;
}

// ── SURFACE DEFINITIONS (parametric — no holes!) ──
function buildEllipsoid(a,b,c){
  return buildParametric((u,v)=>new THREE.Vector3(
    a*Math.sin(v)*Math.cos(u),
    c*Math.cos(v),
    b*Math.sin(v)*Math.sin(u)
  ),64,32,0xe53935,0,Math.PI*2,0,Math.PI);
}

function buildSphere(r){
  return buildParametric((u,v)=>new THREE.Vector3(
    r*Math.sin(v)*Math.cos(u),
    r*Math.cos(v),
    r*Math.sin(v)*Math.sin(u)
  ),64,32,0x43a047,0,Math.PI*2,0,Math.PI);
}

function buildHyp1(a,b,c){
  // x²/a² + z²/b² - y²/c² = 1  (one sheet, y is vertical)
  // Parametric: x=a*cosh(v)*cos(u), z=b*cosh(v)*sin(u), y=c*sinh(v)
  return buildParametric((u,v)=>new THREE.Vector3(
    a*Math.cosh(v)*Math.cos(u),
    c*Math.sinh(v),
    b*Math.cosh(v)*Math.sin(u)
  ),64,40,0xf57c00,0,Math.PI*2,-2,2);
}

function buildHyp2(a,b,c){
  // Two sheets: y²/c² - x²/a² - z²/b² = 1
  // Sheet 1: y = c*cosh(v), x=a*sinh(v)*cos(u), z=b*sinh(v)*sin(u)
  const g=new THREE.Group();
  function sheet(sign,col){
    return buildParametric((u,v)=>new THREE.Vector3(
      a*Math.sinh(v)*Math.cos(u),
      sign*c*Math.cosh(v),
      b*Math.sinh(v)*Math.sin(u)
    ),64,30,col,0,Math.PI*2,0,2);
  }
  g.add(sheet(1,0x8e24aa));
  g.add(sheet(-1,0x8e24aa));
  return g;
}

function buildEllipPar(a,b){
  // x²/a² + z²/b² = 2y (y is vertical)
  return buildParametric((u,v)=>new THREE.Vector3(
    a*v*Math.cos(u),
    v*v/2,
    b*v*Math.sin(u)
  ),64,30,0x1e88e5,0,Math.PI*2,0,3.5);
}

function buildHypPar(a,b){
  // x²/a² - z²/b² = 2y
  // Use grid parametric on xz plane
  const g=new THREE.BufferGeometry();
  const N=60;
  const pos=[],nrm=[],idx=[];
  const R=5;
  for(let iz=0;iz<=N;iz++){
    for(let ix=0;ix<=N;ix++){
      const x=-R+ix*(2*R/N);
      const z=-R+iz*(2*R/N);
      const y=(x*x/(a*a)-z*z/(b*b))/2;
      pos.push(x,y,z);
      // Normal
      const dx=1/a/a*x,dz=-1/b/b*z;
      const n=new THREE.Vector3(-dx,1,-dz).normalize();
      nrm.push(n.x,n.y,n.z);
    }
  }
  for(let iz=0;iz<N;iz++){for(let ix=0;ix<N;ix++){const a2=iz*(N+1)+ix,b2=a2+1,c2=a2+(N+1),d2=c2+1;idx.push(a2,b2,c2,b2,d2,c2);}}
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setIndex(idx);g.computeVertexNormals();
  const c=new THREE.Color(0xd81b60);
  return new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:c,emissive:c.clone().multiplyScalar(.05),specular:new THREE.Color(0xffffff),shininess:80,transparent:true,opacity:.92,side:THREE.DoubleSide}));
}

// ── SURFACES CONFIG ────────────────────────────
const SURFS={
  ellipsoid:{name:'Эллипсоид',eq:'x²/a² + y²/b² + z²/c² = 1',color:'#e53935',
    sliders:[{id:'a',lbl:'a',val:3,min:.5,max:10,step:.1},{id:'b',lbl:'b',val:2,min:.5,max:10,step:.1},{id:'c',lbl:'c',val:4,min:.5,max:10,step:.1}],
    build:p=>buildEllipsoid(p.a,p.b,p.c),
    info:p=>[{k:'Полуось a',v:p.a},{k:'Полуось b',v:p.b},{k:'Полуось c',v:p.c},{k:'Объём',v:Math.round(4/3*Math.PI*p.a*p.b*p.c*10)/10},{k:'Тип',v:'Замкнутая'},{k:'e',v:'< 1'}]},
  sphere:{name:'Сфера',eq:'x² + y² + z² = r²',color:'#43a047',
    sliders:[{id:'r',lbl:'r',val:3,min:.5,max:10,step:.1}],
    build:p=>buildSphere(p.r),
    info:p=>[{k:'Радиус',v:p.r},{k:'Объём',v:Math.round(4/3*Math.PI*p.r**3*10)/10},{k:'Площадь',v:Math.round(4*Math.PI*p.r**2*10)/10},{k:'Тип',v:'Частный эллипсоид'}]},
  hyp1:{name:'Однополостный гиперболоид',eq:'x²/a² + z²/b² − y²/c² = 1',color:'#f57c00',
    sliders:[{id:'a',lbl:'a',val:2,min:.5,max:10,step:.1},{id:'b',lbl:'b',val:2,min:.5,max:10,step:.1},{id:'c',lbl:'c',val:2,min:.5,max:10,step:.1}],
    build:p=>buildHyp1(p.a,p.b,p.c),
    info:p=>[{k:'Полуось a',v:p.a},{k:'Полуось b',v:p.b},{k:'Полуось c',v:p.c},{k:'Полости',v:'1 (одна)'},{k:'e',v:'> 1'}]},
  hyp2:{name:'Двуполостный гиперболоид',eq:'y²/c² − x²/a² − z²/b² = 1',color:'#8e24aa',
    sliders:[{id:'a',lbl:'a',val:2,min:.5,max:10,step:.1},{id:'b',lbl:'b',val:2,min:.5,max:10,step:.1},{id:'c',lbl:'c',val:2,min:.5,max:10,step:.1}],
    build:p=>buildHyp2(p.a,p.b,p.c),
    info:p=>[{k:'Полуось a',v:p.a},{k:'Полуось b',v:p.b},{k:'Полуось c',v:p.c},{k:'Полости',v:'2 (две)'},{k:'e',v:'> 1'}]},
  ellippar:{name:'Эллиптический параболоид',eq:'x²/a² + z²/b² = 2y',color:'#1e88e5',
    sliders:[{id:'a',lbl:'a',val:2,min:.5,max:10,step:.1},{id:'b',lbl:'b',val:2,min:.5,max:10,step:.1}],
    build:p=>buildEllipPar(p.a,p.b),
    info:p=>[{k:'a',v:p.a},{k:'b',v:p.b},{k:'Форма',v:'«Чаша»'},{k:'Вершина',v:'(0,0,0)'}]},
  hyppar:{name:'Гиперболический параболоид',eq:'x²/a² − z²/b² = 2y',color:'#d81b60',
    sliders:[{id:'a',lbl:'a',val:2,min:.5,max:10,step:.1},{id:'b',lbl:'b',val:2,min:.5,max:10,step:.1}],
    build:p=>buildHypPar(p.a,p.b),
    info:p=>[{k:'a',v:p.a},{k:'b',v:p.b},{k:'Форма',v:'«Седло»'},{k:'Вершина',v:'(0,0,0)'}]},
};

let curSurf='ellipsoid';
let params={a:3,b:2,c:4,r:3};

function updateSliderGradient(el){
  const min=parseFloat(el.min),max=parseFloat(el.max),val=parseFloat(el.value);
  const pct=((val-min)/(max-min)*100).toFixed(1)+'%';
  el.style.setProperty('--pct',pct);
}

function renderSliders(surf){
  const s=SURFS[surf];
  const sec=document.getElementById('sliders');
  sec.innerHTML='';
  s.sliders.forEach(sl=>{
    const v=params[sl.id]!==undefined?params[sl.id]:sl.val;
    params[sl.id]=v;
    const row=document.createElement('div');row.className='sl-row';
    row.innerHTML=`<div class="sl-top"><span class="sl-name">${sl.lbl}</span><input class="sl-val" id="val-${sl.id}" type="number" value="${v}" min="${sl.min}" max="${sl.max}" step="${sl.step}"></div><div class="sl-track"><span class="sl-edge">${sl.min}</span><input type="range" id="sl-${sl.id}" min="${sl.min}" max="${sl.max}" step="${sl.step}" value="${v}"><span class="sl-edge">${sl.max}</span></div>`;
    sec.appendChild(row);
    const slEl=row.querySelector('#sl-'+sl.id);
    const valEl=row.querySelector('#val-'+sl.id);
    updateSliderGradient(slEl);
    slEl.addEventListener('input',()=>{
      params[sl.id]=parseFloat(slEl.value);
      valEl.value=slEl.value;
      updateSliderGradient(slEl);
      build(false);
    });
    valEl.addEventListener('change',()=>{
      const nv=Math.max(sl.min,Math.min(sl.max,parseFloat(valEl.value)||sl.val));
      params[sl.id]=nv;valEl.value=nv;slEl.value=nv;
      updateSliderGradient(slEl);build(false);
    });
  });
}

function build(closePanel=true){
  clearMesh();
  document.getElementById('errmsg').style.display='none';
  try{
    const s=SURFS[curSurf];
    const mesh=s.build(params);
    sc.add(mesh);curMesh=mesh;
    document.getElementById('badge').style.display='block';
    document.getElementById('bname').textContent=s.name;
    document.getElementById('beq').textContent=s.eq;
    document.getElementById('info-chips').innerHTML=s.info(params).map(r=>`<div class="chip"><div class="chip-k">${r.k}</div><div class="chip-v">${r.v}</div></div>`).join('');
  }catch(e){
    const err=document.getElementById('errmsg');err.textContent='⚠ '+e.message;err.style.display='block';setTimeout(()=>err.style.display='none',4000);
  }
  if(closePanel&&window.innerWidth<700)setTimeout(()=>{panel.classList.remove('open');fab.classList.remove('hidden');},300);
}

function selectSurf(surf){
  curSurf=surf;
  document.querySelectorAll('.surf-tab').forEach(b=>b.classList.toggle('active',b.dataset.surf===surf));
  const s=SURFS[surf];
  s.sliders.forEach(sl=>params[sl.id]=sl.val);
  document.getElementById('eq-formula').textContent=s.eq;
  document.getElementById('eq-dot').style.background=s.color;
  renderSliders(surf);build(false);
}

document.querySelectorAll('.surf-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    selectSurf(btn.dataset.surf);
    if(window.innerWidth<700){panel.classList.add('open');fab.classList.add('hidden');}
  });
});
document.getElementById('bbtn').addEventListener('click',()=>build(true));

function animate(){requestAnimationFrame(animate);updCam();ren.render(sc,cam);}
selectSurf('ellipsoid');
animate();
</script>
</body>
</html>
